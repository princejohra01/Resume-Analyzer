<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #777;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and analyze it instantly.
        </p>

        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <div class="upload-box">
                <h3>Upload Resume</h3>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if result %}
            <div class="result">
                <h2>Analysis Result</h2>
                <p>{{ result }}</p>
            </div>
        {% endif %}

    </div>
</div>

</body>
</html>
